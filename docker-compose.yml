services:
  # Produção: build + servidor estático em Node (sem nginx). http://localhost:3000
  site:
    build: .
    image: tonho-e-gabi-site
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Desenvolvimento com recarga automática: docker compose --profile dev up dev
  # http://localhost:5173
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
